      // --- SUBCOMPONENT: VIDEO TOUR WITH AI VOICE DUBBING ---
      function VideoTourView({ scenes, onNavigate }) {
        const [sceneIdx, setSceneIdx] = useState(0);
        const [isPlaying, setIsPlaying] = useState(false);
        const [progress, setProgress] = useState(0);
        const [isMuted, setIsMuted] = useState(false);
        const [speed, setSpeed] = useState(1);
        const timerRef = useRef(null);

        const currentScene = scenes[sceneIdx];

        const speakText = (text) => {
          if (isMuted || !('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = speed;
          utterance.pitch = 1.05;

          const voices = window.speechSynthesis.getVoices();
          const best = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha'))) || voices.find(v => v.lang.startsWith('en'));
          if (best) utterance.voice = best;

          window.speechSynthesis.speak(utterance);
        };

        useEffect(() => {
          setProgress(0);
          if (isPlaying) {
            speakText(currentScene.narrationText);
          } else {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          }
        }, [sceneIdx, isPlaying]);

        useEffect(() => {
          if (!isPlaying) {
            clearInterval(timerRef.current);
            return;
          }
          const duration = (currentScene.durationSec / speed) * 1000;
          const step = (100 / duration) * 100;
          timerRef.current = setInterval(() => {
            setProgress(p => {
              if (p >= 100) {
                if (sceneIdx < scenes.length - 1) {
                  setSceneIdx(i => i + 1);
                  return 0;
                } else {
                  setIsPlaying(false);
                  return 100;
                }
              }
              return p + step;
            });
          }, 100);
          return () => clearInterval(timerRef.current);
        }, [isPlaying, sceneIdx, speed]);

        return (
          <div className="max-w-5xl mx-auto px-4 py-8">
            <div className="bg-white border-3.5 border-neutral-900 rounded-3xl brutal-shadow-lg overflow-hidden">
              {/* Header */}

                <div className="flex items-center gap-2">
                  <span className="text-xl">🎬</span>

                </div>
                <button
                  onClick={() => {
                    setIsMuted(!isMuted);
                    if (!isMuted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
                    else if (isPlaying) speakText(currentScene.narrationText);

                >
                  {isMuted ? '🔇 Muted' : '🔊 Sound On'}

              </div>

              {/* Screen Area */}

                {/* Visual waves indicator */}
                <div className="absolute top-4 right-4 flex items-center gap-1.5 bg-white/90 border-2 border-neutral-900 px-3 py-1 rounded-full text-xs font-bold">
                  <span>🎙️</span>
                  <span>{isPlaying && !isMuted ? 'AI Voice Speaking...' : 'Voice Paused'}</span>
                </div>

                {/* Animated Scene Content */}
                <div className="flex-1 flex flex-col justify-center max-w-3xl mx-auto w-full text-center">
                  <span className="text-xs font-black uppercase tracking-wider bg-amber-200 border border-neutral-900 px-3 py-1 rounded-full self-center mb-2">
                    {currentScene.badge}

                  <h2 className="text-3xl sm:text-4xl font-black font-doodle text-neutral-900 mb-2">
                    {currentScene.title}
                  </h2>
                  <p className="text-sm sm:text-base text-neutral-700 font-medium mb-4">
                    {currentScene.subtitle}

                  <div className="flex flex-wrap justify-center gap-2 mb-4">

                  </div>
                  <button

      // --- SUBCOMPONENT: LIVE CANVAS ---
      function LiveCanvasView({ user, initialProblem, onAskAI, onPostToWall }) {
        const canvasRef = useRef(null);
        const [isDrawing, setIsDrawing] = useState(false);
        const [tool, setTool] = useState('pen');
        const [color, setColor] = useState('#18181b');
        const [title, setTitle] = useState(initialProblem ? `Solving: ${initialProblem}` : 'My Homework Sketchnote');
        const [stickyText, setStickyText] = useState('✏️ Add formulas or ideas!');
        const [stickers, setStickers] = useState(['🐣']);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFDF8';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          // Faint grid
          ctx.strokeStyle = '#F1ECE1';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
          for (let y = 0; y < canvas.height; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
          // Margin line
          ctx.strokeStyle = '#FCA5A5';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(48, 0); ctx.lineTo(48, canvas.height); ctx.stroke();
        }, []);

        const startDraw = (e) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const ctx = canvas.getContext('2d');
          ctx.beginPath();
          ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
          setIsDrawing(true);
        };

        const draw = (e) => {
          if (!isDrawing) return;
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const ctx = canvas.getContext('2d');
          ctx.lineCap = 'round';
          if (tool === 'eraser') {
            ctx.strokeStyle = '#FFFDF8';
            ctx.lineWidth = 20;
          } else if (tool === 'highlighter') {
            ctx.strokeStyle = color;
            ctx.lineWidth = 14;
            ctx.globalAlpha = 0.35;
          } else {
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 1.0;
          }
          ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
          ctx.stroke();
        };

        const stopDraw = () => setIsDrawing(false);

        return (
          <div className="max-w-6xl mx-auto px-4 py-8">
            <div className="bg-white border-3 border-neutral-900 rounded-3xl p-5 brutal-shadow mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <input
                type="text"
                value={title}
                onChange={e => setTitle(e.target.value)}
                className="font-doodle text-xl font-bold border-b-2 border-dashed border-neutral-400 focus:outline-none w-full sm:w-auto flex-1"
              />
              <div className="flex gap-2">
                <button
                  onClick={() => onAskAI(title)}
                  className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl border-2 border-neutral-900 brutal-shadow-sm brutal-btn"
                >
                  ⚡ AI Solve Canvas
                </button>
                <button
                  onClick={() => {
                    onPostToWall({
                      id: 'w-' + Date.now(),
                      title,
                      author: user.name,
                      avatar: user.avatar,
                      subject: 'Math',
                      description: `Sketchnote: ${title}`,
                      stars: 1,
                      hasStarred: true,
                      explanation: 'Created on DoodleSquad Live Canvas!'
                    });
                    confetti({ particleCount: 40 });
                  }}
                  className="px-3.5 py-2 bg-amber-400 hover:bg-amber-300 text-neutral-900 font-bold text-xs rounded-xl border-2 border-neutral-900 brutal-shadow-sm brutal-btn"
                >
                  🏆 Post to Wall
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
              {/* Toolbar */}
              <div className="md:col-span-2 bg-white border-3 border-neutral-900 rounded-2xl p-4 brutal-shadow flex md:flex-col gap-2 overflow-x-auto">
                <button onClick={() => setTool('pen')} className={`p-2 rounded-xl border text-xs font-bold ${tool === 'pen' ? 'bg-amber-300 border-neutral-900' : 'bg-neutral-50'}`}>✏️ Pen</button>
                <button onClick={() => setTool('highlighter')} className={`p-2 rounded-xl border text-xs font-bold ${tool === 'highlighter' ? 'bg-amber-300 border-neutral-900' : 'bg-neutral-50'}`}>🖍️ Marker</button>
                <button onClick={() => setTool('eraser')} className={`p-2 rounded-xl border text-xs font-bold ${tool === 'eraser' ? 'bg-amber-300 border-neutral-900' : 'bg-neutral-50'}`}>🧹 Eraser</button>
                <div className="h-px bg-neutral-200 my-1 hidden md:block" />
                <div className="flex md:grid md:grid-cols-3 gap-1.5">
                  {['#18181b', '#EAB308', '#F43F5E', '#0284C7', '#16A34A', '#9333EA'].map(c => (
                    <button key={c} onClick={() => setColor(c)} className="w-6 h-6 rounded-full border border-neutral-400" style={{ backgroundColor: c }} />
                  ))}
                </div>
              </div>

              {/* Canvas Pad */}
              <div className="md:col-span-10 relative bg-white border-3 border-neutral-900 rounded-2xl brutal-shadow overflow-hidden min-h-[500px]">
                <canvas
                  ref={canvasRef}
                  width={800}
                  height={500}
                  onMouseDown={startDraw}
                  onMouseMove={draw}
                  onMouseUp={stopDraw}
                  className="w-full h-[500px] cursor-crosshair"
                />

                {/* Sticky Note */}
                <div className="absolute top-6 left-16 bg-yellow-200 border-2 border-neutral-900 rounded-lg p-2.5 w-44 brutal-shadow-sm rotate-1">
                  <span className="text-[10px] font-bold text-neutral-600 block">📌 Sticky</span>
                  <textarea

                    onChange={e => setStickyText(e.target.value)}
                    className="w-full font-hand text-xs font-bold bg-transparent focus:outline-none resize-none h-14"
                  />
                </div>
              </div>
            </div>
          </div>
        );
      }

                    {/* Focus Timer */}
                    <div className="flex items-center gap-2 bg-[#FFFDF5] border-2 border-neutral-900 px-3 py-1.5 rounded-xl brutal-shadow-sm">
                      <span className="font-mono text-base font-black">⏱️ {formatTime(timerSec)}</span>
                      <button onClick={() => setIsRunning(!isRunning)} className="px-2 py-0.5 bg-neutral-900 text-white rounded text-xs font-bold">
                        {isRunning ? 'Pause' : 'Start'}
                      </button>
                    </div>
                  </div>

                  {/* Chat messages */}
                  <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                    {currentSquad.messages.map(m => (
                      <div key={m.id} className="p-2.5 rounded-xl border border-neutral-200 text-xs bg-[#FFFDF8]">
                        <div className="flex justify-between font-bold text-neutral-800 mb-0.5">
                          <span>{m.avatar} {m.author}</span>
                          <span className="text-[10px] text-neutral-400">{m.time}</span>
                        </div>
                        <p className="text-neutral-700">{m.text}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Chat input */}
                <form onSubmit={handleSend} className="flex gap-2 pt-3 border-t-2 border-neutral-200 mt-4">
                  <input
                    type="text"
                    value={chatMsg}
                    onChange={e => setChatMsg(e.target.value)}
                    placeholder="Share a formula hint or ask the squad..."
                    className="flex-1 px-3 py-2 text-xs border-2 border-neutral-900 rounded-xl focus:outline-none"
                  />
                  <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl border border-neutral-900">
                    Send (+10 XP)
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // --- SUBCOMPONENT: WALL OF FAME ---
      function WallOfFameView({ wallItems, setWallItems, onClone, onAddXp }) {
        const [filter, setFilter] = useState('All');

        const handleStar = (id) => {
          setWallItems(items => items.map(item => {
            if (item.id === id) {
              const newStarred = !item.hasStarred;
              if (newStarred) { onAddXp(10); confetti({ particleCount: 20 }); }
              return { ...item, stars: item.stars + (newStarred ? 1 : -1), hasStarred: newStarred };
            }
            return item;
          }));
        };

        const filtered = filter === 'All' ? wallItems : wallItems.filter(i => i.subject === filter);

        return (
          <div className="max-w-6xl mx-auto px-4 py-8">
            <div className="text-center mb-6">
              <span className="px-3 py-1 bg-amber-200 border-2 border-neutral-900 rounded-full text-xs font-bold mb-2 inline-block">
                🏆 Peer Hall of Fame
              </span>
              <h2 className="text-3xl font-black font-doodle text-neutral-900">Community Wall of Fame</h2>
            </div>

            <div className="flex gap-2 justify-center mb-6">
              {['All', 'Math', 'Science', 'Coding'].map(sub => (
                <button
                  key={sub}
                  onClick={() => setFilter(sub)}
                  className={`px-3 py-1 rounded-xl border-2 text-xs font-bold ${filter === sub ? 'bg-amber-300 border-neutral-900' : 'bg-white border-neutral-300'}`}
                >
                  {sub}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {filtered.map(item => (
                <div key={item.id} className="notebook-pattern bg-white border-3 border-neutral-900 rounded-3xl p-5 brutal-shadow flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-[10px] font-black bg-amber-100 border border-amber-300 px-2 py-0.5 rounded">{item.subject}</span>
                      <button
                        onClick={() => handleStar(item.id)}
                        className={`px-2.5 py-0.5 rounded-lg border text-xs font-bold ${item.hasStarred ? 'bg-amber-300 border-neutral-900' : 'bg-white border-neutral-300'}`}
                      >
                        ⭐ {item.stars}
                      </button>
                    </div>
                    <h3 className="font-doodle text-lg font-bold text-neutral-900 mb-1">{item.title}</h3>
                    <p className="text-xs text-neutral-600 mb-3">{item.description}</p>
                    <div className="bg-[#FFFDF5] border border-dashed border-neutral-300 p-2.5 rounded-lg text-xs font-hand font-bold text-neutral-800 mb-3">
                      "{item.explanation}"
                    </div>
                  </div>
                  <div className="flex items-center justify-between pt-2 border-t border-neutral-200 text-xs">
                    <span>{item.avatar} {item.author}</span>
                    <button onClick={() => onClone(item)} className="px-2.5 py-1 bg-indigo-600 text-white rounded-lg font-bold text-[11px]">
                      Clone to Canvas 🎨
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // --- SUBCOMPONENT: DAILY CHALLENGES ---
      function DailyChallengesView({ challenges, setChallenges, onOpenCanvas, onAddXp }) {
        return (
          <div className="max-w-6xl mx-auto px-4 py-8">
            <h2 className="text-2xl font-black font-doodle text-neutral-900 mb-4">Daily Brain Warm-ups 🎯</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {challenges.map(c => (
                <div key={c.id} className="bg-white border-3 border-neutral-900 rounded-2xl p-4 brutal-shadow flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between text-xs font-bold mb-2">
                      <span className="text-indigo-600">{c.subject}</span>
                      <span className="text-amber-700">+{c.rewardXp} XP</span>
                    </div>
                    <h4 className="font-doodle font-bold text-base mb-1">{c.title}</h4>
                    <p className="text-xs text-neutral-600 mb-3">{c.prompt}</p>
                  </div>
                  <div className="flex gap-2 pt-2 border-t border-neutral-200">
                    <button onClick={() => onOpenCanvas(c.prompt)} className="flex-1 py-1.5 bg-amber-300 text-neutral-900 text-xs font-bold rounded-lg border border-neutral-900">
                      Draw on Canvas 🖌️
                    </button>
                    {c.completed ? (
                      <span className="px-2 py-1.5 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-lg">Done ✓</span>
                    ) : (
                      <button
                        onClick={() => {
                          setChallenges(prev => prev.map(ch => ch.id === c.id ? { ...ch, completed: true } : ch));
                          onAddXp(c.rewardXp);
                          confetti({ particleCount: 30 });
                        }}
                        className="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg"
                      >
                        Solve!
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // Mount App
      ReactDOM.createRoot(document.getElementById('root')).render(<DoodleSquadApp />);
    </script>
  </body>
</html>
